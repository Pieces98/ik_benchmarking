moveit_config_pkg: lab_sim  # Name of the MoveIt configuration package of the robot
robot_name: lab_sim  # Name of the robot
planning_group: manipulator  # Planning group configured inside the MoveIt config package (usually in the file config/robot_name.srdf)
sample_size: 1000  # Number of samples to run for collecting IK benchmarking data for different solvers
random_seed: 12345  # Seed to use for random number generation, for generating reproducible results
ik_timeout: 0.1  # Maximum duration (in seconds) allowed for an IK solver to find a solution before being considered unsuccessful
ik_iteration_display_step: 10000  # Number of IK solves for printing updates

ik_solvers:  # List of IK solvers and their kinematics configuration files to include in the benchmarking process

#  - name: kdl  # Name of the IK solver
#    kinematics_file: kdl_kinematics.yaml  # Name of the IK solver's kinematics configuration file

#  - name: trac_ik_distance
#    kinematics_file: trac_ik_kinematics_distance.yaml

  - name: trac_ik_speed
    kinematics_file: trac_ik_kinematics_speed.yaml

