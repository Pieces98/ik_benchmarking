robot_name: mw2  # Name of the robot
planning_group: manipulator  # Planning group configured inside the MoveIt config package (mw2.srdf)

# URDF / SRDF source — read at launch time and injected as parameters into the
# server node, so /move_group does not need to be running.
# urdf_path is processed through xacro (works for both .xacro and plain .urdf).
urdf_pkg: mw2_base_config
urdf_path: description/mw2.urdf.xacro
srdf_pkg: mw2_base_config
srdf_path: config/moveit/mw2.srdf

sample_size: 10000  # Number of samples to run for collecting IK benchmarking data for different solvers
random_seed: 12345  # Seed to use for random number generation, for generating reproducible results
ik_timeout: 0.1  # Maximum duration (in seconds) allowed for an IK solver to find a solution before being considered unsuccessful
ik_iteration_display_step: 1000  # Number of IK solves for printing updates
check_self_collision: false  # If true, reject self-colliding target poses (resample) and require IK solutions to be self-collision free

ik_solvers:  # MoveIt Pro variant uses pose_ik directly; entries here are CSV-filename labels only

  - name: pose_ik
