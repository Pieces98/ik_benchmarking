moveit_config_pkg: mw2_base_config  # MoveIt config package providing URDF and SRDF
robot_name: mw2  # Name of the robot
planning_group: manipulator  # Planning group from <moveit_config_pkg>/config/moveit/mw2.srdf
sample_size: 10000  # Number of IK samples per solver (matches mw2-moveit-pro-ik-benchmarking for cross-comparison)
random_seed: 12345  # Seed for reproducible random joint sampling
ik_timeout: 0.1  # External wall-clock cap (seconds) — passed to setFromIK, applied uniformly to all solvers
ik_iteration_display_step: 1000  # Logging frequency

# Non-standard layout overrides (optional). Paths are relative to <moveit_config_pkg>/share.
# Omit these to use MoveItConfigsBuilder defaults (config/<robot>.urdf.xacro, config/<robot>.srdf).
urdf_path: description/mw2.urdf.xacro
srdf_path: config/moveit/mw2.srdf
joint_limits_path: config/moveit/joint_limits.yaml

# Where per-solver kinematics YAMLs live. Defaults: kinematics_source_pkg=moveit_config_pkg, kinematics_subdir=config.
# Set kinematics_source_pkg=ik_benchmarking to keep solver configs inside this package (mw2_base_config stays clean).
kinematics_source_pkg: ik_benchmarking
kinematics_subdir: config

ik_solvers:
  - name: kdl
    kinematics_file: kdl_kinematics.yaml

  - name: trac_ik_speed
    kinematics_file: trac_ik_kinematics_speed.yaml

  - name: bio_ik
    kinematics_file: bio_ik_kinematics.yaml

  - name: pick_ik
    kinematics_file: pick_ik_kinematics.yaml
